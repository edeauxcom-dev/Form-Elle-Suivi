<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=suivi-hebdo-form.html">
<title>Form'Elle — Suivi hebdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #EB7AA6;
    --pink-dark: #C85885;
    --pink-tint: #FDF1F5;
    --text-dark: #3A3A3A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, var(--pink-dark) 0%, var(--pink) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    background: white;
    border-radius: 14px;
    padding: 40px 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
  }
  h1 {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 20px;
    color: var(--pink-dark);
    margin-bottom: 10px;
  }
  p { color: var(--text-dark); font-size: 13.5px; margin-bottom: 22px; }
  .spinner {
    width: 26px; height: 26px;
    border: 3px solid var(--pink-tint);
    border-top-color: var(--pink-dark);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.btn {
    display: inline-block;
    background: linear-gradient(135deg, var(--pink-dark), var(--pink));
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    padding: 12px 28px;
    border-radius: 8px;
    box-shadow: 0 3px 10px rgba(200,88,133,.35);
  }
  .fallback { margin-top: 18px; font-size: 11.5px; color: #999; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Form'Elle — Suivi hebdo</h1>
    <p>Redirection vers la fiche de suivi en cours…</p>
    <a class="btn" href="suivi-hebdo-form.html">Ouvrir la fiche maintenant</a>
    <div class="fallback">Si rien ne se passe, clique sur le bouton ci-dessus.</div>
  </div>
</body>
</html>
